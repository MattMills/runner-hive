# Manually triggered end-to-end check against a live runner-hive registration
# labelled `hive-e2e`. Not run automatically.
name: hive-e2e

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "matrix (3 parallel jobs) or cancel (one long job to cancel)"
        default: matrix
        type: choice
        options: [matrix, cancel]

permissions:
  contents: read

jobs:
  matrix:
    if: inputs.mode == 'matrix'
    strategy:
      matrix:
        n: [1, 2, 3]
    runs-on: [self-hosted, hive-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Hello
        shell: bash
        run: echo "job ${{ matrix.n }} on $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH) in $GITHUB_WORKSPACE"
      - name: Admin token must not reach jobs
        shell: bash
        run: |
          if [ -n "${GITHUB_TOKEN:-}${GH_TOKEN:-}${RUNNER_HIVE_TOKEN:-}" ]; then
            echo "admin token leaked into the job environment"; exit 1
          fi
      - name: Runner private key must not be in the slot
        shell: bash
        run: |
          root="$(cd "$RUNNER_WORKSPACE/../.." && pwd)"
          ls -la "$root"
          if ls "$root"/.credentials_rsaparams 2>/dev/null; then exit 1; fi
          cat "$root/.runner"
      - name: Job cannot escalate or read the daemon (Linux, worker.run_as)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          id
          if sudo -n true 2>/dev/null; then echo "job has passwordless sudo"; exit 1; fi
          for p in /proc/[0-9]*; do
            if grep -qa RUNNER_HIVE_TOKEN "$p/environ" 2>/dev/null; then
              echo "admin token readable via $p/environ"; exit 1
            fi
          done
          echo "HOME=$HOME CARGO_HOME=${CARGO_HOME:-} RUSTUP_HOME=${RUSTUP_HOME:-}"
          command -v cargo && cargo --version
      - name: Job outputs and step summaries work
        id: out
        shell: bash
        run: |
          echo "answer=42" >> "$GITHUB_OUTPUT"
          echo "### hello from runner-hive" >> "$GITHUB_STEP_SUMMARY"
      - shell: bash
        run: test "${{ steps.out.outputs.answer }}" = 42

  cancel:
    if: inputs.mode == 'cancel'
    runs-on: [self-hosted, hive-e2e]
    steps:
      - name: Wait to be cancelled
        shell: bash
        run: |
          for i in $(seq 1 600); do echo "tick $i"; sleep 1; done
      - name: Cleanup runs on cancel
        if: cancelled()
        shell: bash
        run: echo "post-cancel cleanup ran"
